<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="calculator">
    <h1 class="calculator-name" font="Times New Roman">Calculator</h1>
    <div class="screen">
      <input type="text" id="calc-screen" readonly>
    </div>

    <div class="buttons">      
      <button class="btn" onclick="appendValue('7')">7</button>
      <button class="btn" onclick="appendValue('8')">8</button>

      <button class="btn" onclick="appendValue('9')">9</button>
      <button class="btn operator" onclick="appendValue('/')">/</button>

      <button class="btn" onclick="appendValue('4')">4</button>
      <button class="btn" onclick="appendValue('5')">5</button>

      <button class="btn" onclick="appendValue('6')">6</button>
      <button class="btn operator" onclick="appendValue('*')">*</button>

      <button class="btn" onclick="appendValue('1')">1</button>
      <button class="btn" onclick="appendValue('2')">2</button>

      <button class="btn" onclick="appendValue('3')">3</button>
      <button class="btn operator" onclick="appendValue('-')">-</button>

      <button class="btn" onclick="appendValue('00')">00</button>
      <button class="btn" onclick="appendValue('0')">0</button>

      <button class="btn" onclick="appendValue('%')">%</button>
      <button class="btn operator" onclick="appendValue('+')">+</button>

      <button class="btn equal" onclick="calculateResult()">=</button> 
      <button class="btn" onclick="clearScreen()">C</button>
      <button class="btn" onclick="backspace()">←</button>
   
    </div>
  </div>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  
  <script src="script.js"></script>
  
</body>
</html>
